[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quakes-cli"
version = "0.1.0"
description = "Command line client for the earthquake catalog of the U.S. Geological Survey."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "earthquakes", "jsonargparse", "usgs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "jsonargparse[signatures,shtab]>=4.51.0",
]

[project.urls]
Homepage = "https://github.com/mauvilsa/blog-earthquake-cli"
Issues = "https://github.com/mauvilsa/blog-earthquake-cli/issues"

# The command that gets installed. On the left the name it has in a terminal,
# on the right the function it runs, as "module:function".
[project.scripts]
quakes = "quakes_cli:main"

[tool.setuptools]
py-modules = ["quakes_cli", "quakes_client"]
